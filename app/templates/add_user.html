<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add User</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
    form { display: flex; flex-direction: column; gap: 14px; }
    label { font-weight: 600; font-size: 0.9rem; }
    input, select { padding: 9px 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; font-size: 0.95rem; }
    input:focus, select:focus { outline: 2px solid #1a73e8; border-color: transparent; }
    .actions { display: flex; gap: 10px; margin-top: 4px; }
    button[type="submit"] { padding: 10px 24px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
    button[type="submit"]:hover { background: #1557b0; }
    a.back { padding: 10px 16px; border: 1px solid #ccc; border-radius: 4px; text-decoration: none; color: #444; font-size: 0.95rem; display: inline-block; }
    a.back:hover { background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>Add New User</h1>

  <form method="post" action="/users/add">
    <div>
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required placeholder="e.g. Jane Doe" />
    </div>
    <div>
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required placeholder="e.g. jane@example.com" />
    </div>
    <div>
      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <div>
      <label for="country">Country</label>
      <input type="text" id="country" name="country" required placeholder="e.g. United Kingdom" />
    </div>
    <div class="actions">
      <button type="submit">Add user</button>
      <a class="back" href="/">Cancel</a>
    </div>
  </form>
</body>
</html>
