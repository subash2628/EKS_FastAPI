apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      containers:
        - name: fastapi-app
          image: subash26288/fastapi-app:f002181d425ca354a5bcac0c298e1a91332fcdfa
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: fastapi-db-secret