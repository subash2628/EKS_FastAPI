apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      containers:
        - name: fastapi-app
          image: subash26288/fastapi-app:46988b34ef058a32781632284f54ac8564291731
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: fastapi-db-secret