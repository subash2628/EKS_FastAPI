name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    env:
      IMAGE: subash26288/fastapi-app
      TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps and test
        run: |
          pip install -r app/requirements.txt
          pytest app

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t $IMAGE:$TAG -t $IMAGE:latest -f app/Dockerfile app
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Update k8s manifest
        run: |
          sed -i "s|image: .*|image: ${IMAGE}:${TAG}|" k8s/deployment.yaml

      - name: Commit and push manifest change
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "Deploy ${TAG} [skip ci]"
          git push